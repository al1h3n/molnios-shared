# ==========================================================
# hyprlock-glass.conf - Golden Gate edition
# Clone of hyprlock.conf. Same widgets, same positions, restyled.
# Launch: hyprlock -q -c ~/.local/share/molnios/config/hypr/hyprlock-glass.conf
# ==========================================================
#
# WHAT THIS CAN AND CANNOT DO
#
# hyprlock is not GTK, so the GTK CSS limits do not apply here. It is hyprwm's
# own OpenGL client and it has its own, different ceiling. Verified against the
# 0.9.6 source rather than guessed:
#
#   reachable
#     backdrop blur              background { blur_passes, blur_size }
#     saturation lift            background { vibrancy, vibrancy_darkness }
#     film grain                 background { noise }   - Liquid Glass has this
#     specular rim               shape.border_color takes a GRADIENT,
#                                up to 10 stops plus an angle in deg
#     ambient shadow             shadow_passes / size / color / boost
#     continuous-ish corners     rounding
#
#   NOT reachable
#     per-plate backdrop blur    blur exists ONLY on `background`, and it is
#                                global. Shapes composite flat over it. There
#                                is no per-widget blur property at all.
#     refraction / edge lensing  no shader hooks, no plugin API. hyprglass is a
#                                Hyprland compositor plugin; hyprlock is a
#                                separate client and plugins do not reach it.
#     adaptive dim               nothing samples content luminance.
#
#   `shape { xray = 1 }` looks like it should help. It does the opposite: it
#   glScissors the region and clears it to transparent, punching an UNBLURRED
#   hole through to the compositor. That is a window, not frosted glass.
#
# WHY IT STILL LANDS CLOSE
#
# The missing piece is per-plate blur, and a lock screen is the one place that
# barely matters: macOS blurs its entire lock wallpaper too. With everything
# behind already blurred, a translucent plate on top is visually the same
# result. The plates are separated from the background by brightness and by
# the rim, not by blur radius - so background brightness is pulled down to .62
# and the plates add light back.
#
# Colours are inline. hyprlock does support `source = <file>`, but noctalia
# emits ~/.config/hypr/noctalia.lua, which is Lua and not hyprlang, so there is
# nothing to source yet.

# 0. Pre defining colors.
# 1.1. Main.
$white = rgb(255, 255, 255)
$fallback_bg = rgb(31, 137, 153)

# 1.2. RGBA colors.
$null = rgba(0, 0, 0, 0)
$white_transparent = rgba(255, 255, 255, .55)
$white_transparent_extra = rgba(255, 255, 255, .3)
$black_transparent = rgba(0, 0, 0, .75)
$red_transparent = rgba(255, 0, 0, .5)

# 1.3. Main definitions.
$checking_color = $red_transparent
$foreground = $white_transparent
$background = $fallback_bg

# 1.4. Golden Gate glass.
#
# Plate fills. hyprglass tints Golden Gate at alpha 0x10 (.063), but there the
# plate is blurred and its surroundings are not, so blur contrast alone makes
# it legible. Here everything is blurred equally, so a .063 plate would vanish.
# These are raised to carry the same separation using light instead.
$glass        = rgba(255, 255, 255, .10)
$glass_clear  = rgba(255, 255, 255, .06)
$glass_tinted = rgba(255, 255, 255, .24)

# Specular rim. Bright where a light above-left would catch the bevel, falling
# off around the shape. This gradient is the single most recognisable Golden
# Gate cue and the one thing hyprlock gives us for free.
$rim       = rgba(255, 255, 255, .60) rgba(255, 255, 255, .18) rgba(255, 255, 255, .05) 145deg
$rim_soft  = rgba(255, 255, 255, .38) rgba(255, 255, 255, .10) rgba(255, 255, 255, .03) 145deg

# Ambient shadow, not a glow. Golden Gate plates sit slightly off the surface.
$shadow = rgba(0, 0, 0, .40)

# 1. Animations.
animations {
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 2.5, linear
}

# 2. Background image/color.
background {
    color = $background
    path = ~/.local/share/molnios/molnios-media/wallpapers/static/nature/1.jpg

    # Wide and soft. Golden Gate blurs far more than the original 2/2 did -
    # a small radius reads as "out of focus photo", a large one reads as glass.
    blur_passes = 2
    blur_size = 7

    # .62, not .5: the plates now supply their own light, so the wallpaper no
    # longer has to be crushed to keep labels readable.
    brightness = .62
    contrast = .9

    # The saturation lift Golden Gate applies under its plates.
    vibrancy = .22
    vibrancy_darkness = .1

    # Film grain. Liquid Glass dithers its blur to hide banding on gradients,
    # and this is hyprlock's equivalent knob.
    noise = .0125
}

# 3. Password field.
input-field {
    size = 15%, 4.5%
    dots_size = .2
    dots_spacing = .35
    dots_rounding = -1
    font_family = SF Pro Bold
    font_color = $white

    # input-field has no gradient border, only a flat outer_color, so the rim
    # here is a single stop rather than the falloff the shapes get.
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, .35)
    inner_color = $glass
    rounding = -1

    fade_on_empty = false
    check_color = $checking_color
    fail_text = $ATTEMPTS wrong attempts
    placeholder_text = Open sesame..
    position = 0, -17.5%

    shadow_passes = 4
    shadow_size = 14
    shadow_color = $shadow
    shadow_boost = 1.0
}

# 4. Lock icon.
label {
    text = <span> </span>
    color = $white_transparent_extra
    font_size = 30
    font_family = SF Pro Bold
    position = 2, -5%
    valign = top

    shadow_passes = 3
    shadow_size = 10
    shadow_color = $shadow
    shadow_boost = .8
}

# 4.1. Date.
label {
    text = cmd[update:100] echo $(date +"%A, %B %d")
    color = $white_transparent
    font_size = 30
    font_family = SF Pro Rounded Semi-Bold
    position = 0, -9%
    valign = top

    shadow_passes = 3
    shadow_size = 10
    shadow_color = $shadow
    shadow_boost = .8
}

# 4.2. Time.
label {
    text = cmd[update:100] echo $(date +"%-I:%M")
    color = $white_transparent
    font_size = 180
    font_family = SF Pro Rounded Bold
    position = 0, -9.5%
    valign = top
}

# 5.1. Account (name).
label {
    text = cmd[update:100] echo "$(whoami)"
    color = $white
    font_size = 20
    font_family = SF Pro Bold
    position = 0, -12%

    shadow_passes = 3
    shadow_size = 10
    shadow_color = $shadow
    shadow_boost = .8
}

# 5.2. Avatar.
label {
    text = <span> </span>
    color = $white_transparent
    font_size = 80
    font_family = SF Pro Bold
    position = 1.2%, -6.75%

    shadow_passes = 3
    shadow_size = 10
    shadow_color = $shadow
    shadow_boost = .8
}

# 6. Media player.

# 6.1. Song album.
image {
    size = 75
    rounding = 25
    # image.border_color also takes a gradient, so the artwork gets the same rim.
    border_size = 1
    border_color = $rim_soft
    reload_time = 1
    reload_cmd = sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --art
    position = -5.75%, 9.35%
    valign = bottom
    zindex = 1

    shadow_passes = 3
    shadow_size = 8
    shadow_color = $shadow
    shadow_boost = 1
}

# 6.2. Backgrounds.
shape {
    # 6.2.1. Music player source pill.
    # Clear preset: a small pill floating on a larger plate should read as
    # thinner glass, the way stacked Golden Gate surfaces do.
    color = $glass_clear
    border_size = 1
    border_color = $rim
    size = 4%, 2.25%
    rounding = 35
    position = 0, 16.25%
    valign = bottom

    shadow_passes = 3
    shadow_size = 6
    shadow_color = $shadow
    shadow_boost = 1
}

shape {
    # 6.2.2. Main player plate.
    color = $glass
    border_size = 1
    border_color = $rim
    size = 15.5%, 12.4%
    rounding = 35
    position = 0, 3.1%
    valign = bottom

    shadow_passes = 4
    shadow_size = 14
    shadow_color = $shadow
    shadow_boost = 1
}

# 6.3. Player source. (e.g., Spotify, Firefox)
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --player)"
    color = rgba(216, 222, 233, .7)
    font_size = 13
    font_family = SF Pro Bold
    position = 0, 16.625%
    valign = bottom
    zindex = 2
}

# 6.4. Headers.

# 6.4.1. Song title.
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --title)"
    color = rgba(216, 222, 233, .7)
    font_size = 14
    font_family = SF Pro Heavy
    position = 46.25%, 12%
    text_align = left
    halign = left
    valign = bottom
    zindex = 1
}

# 6.4.2. Artist name
label {
    text = cmd[update:100] echo "󰠃 $(sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --artist)"
    color = rgba(216, 222, 233, .7)
    font_size = 12
    font_family = SF Pro
    text_align = left
    position = 46.25%, 10.75%
    halign = left
    valign = bottom
    zindex = 1
}

# 6.5. Progress bar.

# 6.5.1. Current position timestamp.
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --position)"
    color = rgba(216, 222, 233, .7)
    font_size = 10
    font_family = SF Pro Medium
    position = -5.6%, 6.8%
    valign = bottom
}

# 6.5.2. Progress bar (with Pango markup for colored segments).
label {
    text = cmd[update:100] sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --progress-bar
    color = rgba(216, 222, 233, .7)
    font_size = 14
    font_family = SF Pro Medium
    position = 0, 6.6%
    valign = bottom
}

# 6.5.3. Total length timestamp.
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --length)"
    color = rgba(216, 222, 233, .7)
    font_size = 10
    font_family = SF Pro Medium
    position = 5.6%, 6.8%
    valign = bottom
}

# 6.6. Playback Controls.

# 6.6.1. Previous track button.
label {
    text = 󰒮
    color = $white_transparent
    font_size = 25
    onclick = playerctl previous
    position = -2%, 3.85%
    valign = bottom
}

# 6.6.2. Play/Pause button.
label {
    text = cmd[update:100] sh ~/.local/share/molnios/scripts/lock/hyprsong.sh --status
    color = $white_transparent
    font_size = 25
    onclick = playerctl play-pause
    position = 0, 3.85%
    valign = bottom
}

# 6.6.3. Next track button.
label {
    text = 󰒭
    color = $white_transparent
    font_size = 25
    onclick = playerctl next
    position = 2%, 3.85%
    valign = bottom
}

# 7. Internet.
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/lock/inet.sh)"
    text_align = right
    color = $foreground
    font_size = 24
    font_family = SF Pro Semibold
    position = 1%, -1.125%
    halign = left
    valign = top
}

# 8. Battery.
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/monitor/battery.sh)"
    text_align = right
    color = $foreground
    font_size = 24
    font_family = SF Pro Semibold
    position = -1%, -1.125%
    halign = right
    valign = top
}

# 9. Power Menu (Bottom Right)
# 9.1. Background shape (main)
shape {
    color = $glass
    border_size = 1
    border_color = $rim
    size = 6%, 3.5%
    rounding = 25
    position = -4%, 1.125%
    halign = right
    valign = bottom

    shadow_passes = 4
    shadow_size = 12
    shadow_color = $shadow
    shadow_boost = 1
}

# 9.2. Background shape (shutdown button)
# Tinted preset: the destructive action gets the densest glass, so it reads as
# a distinct surface rather than another cell of the pill next to it.
shape {
    color = $glass_tinted
    border_size = 1
    border_color = $rim
    size = 2%, 3.5%
    rounding = 25
    position = -1.375%, 1.125%
    halign = right
    valign = bottom

    shadow_passes = 4
    shadow_size = 12
    shadow_color = $shadow
    shadow_boost = 1
}

# 9.3. Logout button.
label {
    text = <span>󰈆 </span>
    color = $white
    font_size = 23
    font_family = SF Pro
    position = -7.75%, 1.55%
    halign = right
    valign = bottom
    zindex = 2
    onclick = hyprctl dispatch exit
}

# 9.4. Hibernate button.
label {
    text = <span> </span>
    color = $white
    font_size = 22
    font_family = SF Pro
    position = -5.75%, 1.65%
    halign = right
    valign = bottom
    zindex = 2
    onclick = systemctl hibernate
}

# 9.5. Reboot button.
label {
    text = <span> </span>
    color = $white
    font_size = 23
    font_family = SF Pro
    position = -3.75%, 1.55%
    halign = right
    valign = bottom
    zindex = 2
    onclick = systemctl reboot
}

# 9.6. Shutdown button.
label {
    text = <span> </span>
    color = $white
    font_size = 22
    font_family = SF Pro
    position = -1.225%, 1.625%
    halign = right
    valign = bottom
    zindex = 2
    onclick = systemctl poweroff
}

# 10. Weather.
label {
    text = cmd[update:100] echo "$(sh ~/.local/share/molnios/scripts/weather.sh -il almaty -p 2)"
    text_align = right
    color = $foreground
    font_size = 24
    font_family = SF Pro Semibold
    position = 1%, 1.125%
    halign = left
    valign = bottom
}
