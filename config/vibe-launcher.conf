# Launcher defaults. KEY=VALUE, no spaces around =.
# Every setting here has a matching flag that overrides it; run the launcher
# with --help for the full list.
#
# TERMINAL (-t, --terminal): auto | ask | here | wezterm | kitty | ghostty
#                            | alacritty | xterm | macterm | powershell | cmd
#                            | custom
#   auto = reuse the terminal the launcher was started from, else the
#          precedence list (wezterm > kitty > ghostty > alacritty > platform
#          fallback) for launches with no terminal, such as a hotkey or a
#          .desktop entry. ask = prompt for it every run.
#   here = never open a window; the command takes over the current terminal.
#          Set this to keep window-less behaviour even from a hotkey.
#
# APP (-a, --app): command to run inside the chosen directory. Empty = ask.
#   Any command works, not only claude and opencode:
#   APP=opencode
#   APP=claude --resume
#   APP=nvim .
#
# START_DIR (-s, --start-dir): where the directory picker starts browsing.
#   Empty = home directory (%USERPROFILE% / $HOME). Point it at your projects:
#   START_DIR=C:\Users\you\projects
#
# CUSTOM_CMD (-c, --custom-cmd): used only when TERMINAL=custom.
#   @DIR@ = chosen directory (absolute path)
#   @CMD@ = the command to run. On Windows this is the path to a generated
#           one-shot .cmd file, so quote it like any path with spaces.
#   Windows Terminal:  CUSTOM_CMD=wt.exe -d "@DIR@" cmd /k "@CMD@"
#   tmux (Linux/macOS): CUSTOM_CMD=tmux new-window -c "@DIR@" "@CMD@"
#
#   The template is a line of your own shell and is executed as one, so @DIR@
#   is substituted literally: a directory name containing shell metacharacters
#   would be interpreted. On Linux/macOS the launcher also exports $LAUNCH_DIR
#   and $LAUNCH_CMD, which are safe to reference instead of the @ tokens.

TERMINAL=auto
APP=
START_DIR=
CUSTOM_CMD=
